services:
  api:
    build: .
    env_file: .env
    environment:
      PORT: 5177
      AUDIT_LOG_DIR: /app/logs
    volumes:
      - api-logs:/app/logs
    ports:
      - "5177:5177"
  app:
    build: ../gemini-tools-app
    environment:
      API_UPSTREAM: api:5177
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-logs:
