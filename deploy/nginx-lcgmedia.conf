# Host Nginx. Both names must be covered by the Cloudflare Origin certificate.
server {
    listen 80;
    server_name lcgmedia.uk api.lcgmedia.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lcgmedia.uk;
    ssl_certificate /etc/ssl/lcgmedia/origin.pem;
    ssl_certificate_key /etc/ssl/lcgmedia/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 115m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.lcgmedia.uk;
    ssl_certificate /etc/ssl/lcgmedia/origin.pem;
    ssl_certificate_key /etc/ssl/lcgmedia/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 115m;

    # Preserve /api in the URI; Nest routes live under /api.
    location /api/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
    location = / { return 302 /api/docs; }
    location / { return 404; }
}
